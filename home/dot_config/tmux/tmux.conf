# Terminal capabilities for Kitty.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard:hyperlinks"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on

# Keep Kitty-specific variables current when a persistent session is reattached.
set -ga update-environment " KITTY_INSTALLATION_DIR KITTY_LISTEN_ON KITTY_WINDOW_ID"

# Comfortable interactive defaults.
set -g mouse on
set -sg escape-time 10
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g automatic-rename on
setw -g monitor-activity on
set -g visual-activity off

# Create new windows and panes in the current working directory.
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Repeatable pane navigation and resizing.
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Reload this file with Prefix+r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Status bar styled to match DankMaterialShell.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#141218,fg=#cac4cf"
set -g status-left-length 30
set -g status-left "#[bg=#d0bcff,fg=#381e72,bold] #S #[default] "
set -g status-right "#[fg=#9d99a5]#H  %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=#4f378b,fg=#f4efff,bold] #I:#W#F #[default]"
set -g pane-border-style "fg=#49454e"
set -g pane-active-border-style "fg=#d0bcff"
set -g message-style "bg=#4f378b,fg=#f4efff"
set -g mode-style "bg=#d0bcff,fg=#381e72"

