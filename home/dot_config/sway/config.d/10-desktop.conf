# Use Kitty for the stock terminal action and Win+Enter.
set $term kitty
unbindsym $mod+Return
bindsym --no-repeat $mod+Return exec $term

# Hide window title bars while retaining a thin focused-window indicator.
default_border pixel 2
default_floating_border pixel 2
smart_borders on

# The virtual console keyboard configuration is not inherited by Wayland.
input type:keyboard {
    xkb_layout es
    xkb_model pc105
    xkb_options terminate:ctrl_alt_bksp
}

# DankMaterialShell integration.
# The stock bar is replaced by DMS.
bar bar-0 swaybar_command /bin/true

# Export the compositor environment and start the Sway-scoped DMS service.
exec dbus-update-activation-environment --systemd --all
exec systemctl --user start sway-session.target

# DMS launcher and desktop tools. Unbind defaults before intentional overrides.
unbindsym $mod+d
bindsym --no-repeat $mod+d exec ~/.local/bin/discord-wayland

unbindsym $mod+f
bindsym --no-repeat $mod+f exec firefox
bindsym $mod+Shift+f fullscreen

bindsym --no-repeat $mod+o exec obsidian

# Screenshot and code editor shortcuts.
bindsym --no-repeat $mod+Shift+a exec flameshot gui

# Float Flameshot's monitor selector and borderless pinned images.
for_window [app_id="^flameshot$" title="^flameshot$"] floating enable
for_window [app_id="^flameshot$" title="^flameshot-pin$"] floating enable, border none

bindsym --no-repeat $mod+c exec code

unbindsym $mod+space
bindsym --no-repeat $mod+space exec dms ipc call spotlight toggle

unbindsym $mod+v
bindsym --no-repeat $mod+v exec dms ipc call clipboard toggle

bindsym --no-repeat $mod+m exec dms ipc call processlist focusOrToggle
bindsym --no-repeat $mod+comma exec dms ipc call settings focusOrToggle
bindsym --no-repeat $mod+n exec dms ipc call notifications toggle
bindsym --no-repeat $mod+p exec dms ipc call powermenu toggle
bindsym --no-repeat Mod1+space exec dms ipc call spotlight-bar toggle

# DMS lock screen. Win+Right remains available for focus-right navigation.
unbindsym $mod+l
bindsym --no-repeat $mod+l exec dms ipc call lock lock

# Route hardware controls through DMS so its on-screen display is shown.
unbindsym --locked XF86AudioRaiseVolume
unbindsym --locked XF86AudioLowerVolume
unbindsym --locked XF86AudioMute
unbindsym --locked XF86AudioMicMute
bindsym --locked XF86AudioRaiseVolume exec dms ipc call audio increment 3
bindsym --locked XF86AudioLowerVolume exec dms ipc call audio decrement 3
bindsym --locked XF86AudioMute exec dms ipc call audio mute
bindsym --locked XF86AudioMicMute exec dms ipc call mic mute
