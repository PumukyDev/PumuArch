# External displays may expose HDMI or DisplayPort audio outputs.
# Keep them selectable while preferring built-in speakers and wired headphones.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*HDMI.*"
      }
      {
        node.name = "~alsa_output.*hdmi.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
      }
    }
  }
]
