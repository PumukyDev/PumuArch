# Use Kitty as a polished frontend while tmux owns sessions, windows, and panes.
include dank-theme.conf
include dank-tabs.conf

# Typography
font_family FiraCode Nerd Font Mono
font_size 11.0
disable_ligatures never

# Cursor and history
cursor_shape block
cursor_trail 0
scrollback_lines 10000
scrollbar scrolled-and-hovered

# Clipboard and links
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly

# Window appearance
window_padding_width 8
placement_strategy center
background_opacity 1.0
background_blur 0
dynamic_background_opacity no

# Notifications
enable_audio_bell no
visual_bell_duration 0.0

# tmux is persistent, so closing or detaching can close the Kitty frontend safely.
confirm_os_window_close 0
close_on_child_death yes

# Shell integration is loaded manually from Bash so it also works inside tmux.
shell_integration disabled
shell tmux new-session -A -s main
